<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>HVAC仿真平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- 移动端调试：访问 URL 加 ?debug=1 时加载 eruda 浮动 DevTools。
         需要查看手机端 console/network/elements 时使用，例如：
         http://192.168.3.32:5173/?debug=1
         浮动按钮在屏幕一角，点击展开 console / network / elements 等面板。 -->
    <script>
      (function () {
        try {
          var qs = location.search || ''
          var hash = location.hash || ''
          if (qs.indexOf('debug=1') >= 0 || hash.indexOf('debug=1') >= 0
              || localStorage.getItem('hvac_debug') === '1') {
            var s = document.createElement('script')
            s.src = 'https://cdn.jsdelivr.net/npm/eruda'
            s.onload = function () { try { window.eruda && window.eruda.init() } catch (e) {} }
            document.head.appendChild(s)
          }
        } catch (e) {}
      })()
    </script>
  </body>
</html>
