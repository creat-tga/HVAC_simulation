<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="35%" stop-color="#f0f4ff"/>
      <stop offset="70%" stop-color="#f5f0ff"/>
      <stop offset="100%" stop-color="#f0faf5"/>
    </linearGradient>
    <radialGradient id="r1" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#409EFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#409EFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r2" cx="85%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#67C23A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#67C23A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r3" cx="70%" cy="15%" r="25%">
      <stop offset="0%" stop-color="#E6A23C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E6A23C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#409EFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#409EFF" stop-opacity="0.01"/>
    </linearGradient>
  </defs>
  <!-- Base gradient -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Colored radial glows -->
  <rect width="1920" height="1080" fill="url(#r1)"/>
  <rect width="1920" height="1080" fill="url(#r2)"/>
  <rect width="1920" height="1080" fill="url(#r3)"/>
  <!-- Flowing curves -->
  <path d="M0 200 C320 150, 640 280, 960 220 S1600 160, 1920 250 L1920 350 C1600 260, 1280 350, 960 300 S320 240, 0 290Z" fill="#409EFF" fill-opacity="0.025"/>
  <path d="M0 600 C400 550, 800 680, 1200 620 S1700 560, 1920 640 L1920 720 C1700 650, 1400 740, 1200 700 S800 640, 0 680Z" fill="#67C23A" fill-opacity="0.02"/>
  <!-- Top-right decorative circles -->
  <circle cx="1750" cy="100" r="180" fill="none" stroke="#409EFF" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="1750" cy="100" r="120" fill="none" stroke="#409EFF" stroke-opacity="0.04" stroke-width="0.8"/>
  <!-- Bottom-left decorative circles -->
  <circle cx="150" cy="950" r="200" fill="none" stroke="#67C23A" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="150" cy="950" r="140" fill="none" stroke="#67C23A" stroke-opacity="0.03" stroke-width="0.8"/>
  <!-- Subtle bottom wave -->
  <path d="M0 1020 Q480 970 960 1000 Q1440 1030 1920 980 L1920 1080 L0 1080Z" fill="url(#wave1)"/>
